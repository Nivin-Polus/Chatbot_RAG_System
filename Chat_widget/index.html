<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Help Page</title>
    <meta name="description" content="AI-powered knowledge base chat assistant">
    <!-- Use Leto logo as favicon for the widget help page -->
    <link rel="icon" type="image/svg+xml" href="/chat-widget/assets/leto.svg">

    <!-- Open Graph metadata for rich link previews (use Leto logo) -->
    <meta property="og:title" content="Chat Widget - AI-powered knowledge base assistant">
    <meta property="og:description" content="Ask questions and get instant answers from your knowledge base.">
    <meta property="og:type" content="website">
    <!-- Image URLs are dynamically set by JavaScript based on environment config -->
    <meta property="og:image" content="">
    <meta property="og:image:width" content="200">
    <meta property="og:image:height" content="200">

    <!-- Twitter Card metadata -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Chat Widget - AI-powered knowledge base assistant">
    <meta name="twitter:description" content="Ask questions and get instant answers from your knowledge base.">
    <meta name="twitter:image" content="">

    <!-- Use /chat-widget/assets/ when served from backend at /chat-widget/{token} -->
    <link rel="stylesheet" href="/chat-widget/assets/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app" class="app-container">
        <!-- Loading State -->
        <div id="loading-screen" class="loading-screen">
            <div class="loading-spinner"></div>
            <p>Initializing chat...</p>
        </div>

        <!-- Error State -->
        <div id="error-screen" class="error-screen hidden">
            <div class="error-icon">!</div>
            <h2>Unable to Load Chat</h2>
            <p id="error-message">Invalid widget URL. Please check the link and try again.</p>
            <button onclick="window.location.reload()" class="retry-button">Try Again</button>
        </div>

        <!-- Main Chat Interface -->
        <div id="chat-interface" class="chat-interface hidden">
            <!-- Sidebar -->
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-header">
                    <div class="logo-container">
                        <img src="/chat-widget/assets/leto.svg" alt="Leto Logo" class="logo-icon" />
                    </div>
                    <button id="toggle-sidebar" class="toggle-sidebar-btn" title="Toggle Sidebar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                            <line x1="9" y1="3" x2="9" y2="21" />
                        </svg>
                    </button>
                </div>

                <button id="new-chat-btn" class="new-chat-btn" data-tooltip="New Chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg>
                    <span>New Chat</span>
                </button>

                <div class="history-section">
                    <h3 class="history-label">History</h3>
                    <div id="history-list" class="history-list"></div>
                </div>

                <!-- Theme Toggle Footer -->
                <div class="sidebar-footer">
                    <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Theme">
                        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5" />
                            <line x1="12" y1="1" x2="12" y2="3" />
                            <line x1="12" y1="21" x2="12" y2="23" />
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                            <line x1="1" y1="12" x2="3" y2="12" />
                            <line x1="21" y1="12" x2="23" y2="12" />
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                        </svg>
                        <svg class="moon-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                        </svg>
                    </button>
                </div>
            </aside>

            <!-- Main Chat Area -->
            <main id="chat-main" class="chat-main">
                <div class="chat-header">
                    <button id="mobile-menu-btn" class="mobile-menu-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                            <line x1="9" y1="3" x2="9" y2="21" />
                        </svg>
                    </button>
                    <span id="collection-name" class="collection-name">Chat Assistant</span>
                    <button id="header-new-chat-btn" class="header-new-chat-btn" title="New Chat">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                        </svg>
                    </button>
                </div>

                <div id="messages-container" class="messages-container">
                    <div id="messages-list" class="messages-list"></div>
                    <div id="messages-end" class="messages-end"></div>
                </div>

                <form id="chat-form" class="chat-form">
                    <div class="empty-chat-message" id="empty-chat-message">
                        <div class="empty-chat-icon">
                            <!-- Chat bubble icon (SVG) -->
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                            </svg>
                        </div>

                        <div class="empty-chat-text"></div>
                    </div>

                    <div class="input-wrapper">
                        <input type="text" id="message-input" class="message-input" placeholder="Type your message..."
                            autocomplete="off" />
                        <button type="submit" id="send-btn" class="send-btn" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13" />
                                <polygon points="22 2 15 22 11 13 2 9 22 2" />
                            </svg>
                        </button>
                        <button type="button" id="stop-btn" class="stop-btn" style="display: none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="6" y="6" width="12" height="12" rx="1" />
                            </svg>
                        </button>
                    </div>
                    <div class="chat-info">
                        Generated with AI assistance. Always check for accuracy and completeness.
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script src="/chat-widget/assets/config.js?v=20260121_v2"></script>
    <script src="/chat-widget/assets/app.js?v=20260121_v2"></script>
</body>

</html>
